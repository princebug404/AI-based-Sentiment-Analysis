<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Sentiment Analysis</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 60px auto;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 15px;
            font-size: 16px;
            resize: vertical;
            box-sizing: border-box;
        }

        button {
            display: block;
            margin: 20px auto;
            padding: 12px 30px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 30px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            display: none;
        }

        #error {
            margin-top: 20px;
            color: red;
            text-align: center;
        }
    </style>
</head>

<body>

    <h1>AI Sentiment Analysis</h1>

    <textarea
        id="review"
        placeholder="Enter a movie review..."
    ></textarea>

    <button onclick="analyzeSentiment()">
        Analyze Sentiment
    </button>

    <div id="result">
        <h2>Result</h2>

        <p>
            <strong>Sentiment:</strong>
            <span id="sentiment"></span>
        </p>

        <p>
            <strong>Confidence:</strong>
            <span id="confidence"></span>
        </p>
    </div>

    <div id="error"></div>


    <script>
        async function analyzeSentiment() {

            const review = document.getElementById("review").value;

            const resultDiv = document.getElementById("result");
            const errorDiv = document.getElementById("error");

            // Clear previous output
            resultDiv.style.display = "none";
            errorDiv.textContent = "";

            if (!review.trim()) {
                errorDiv.textContent = "Please enter a review.";
                return;
            }

            try {

                const response = await fetch("/predict", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        text: review
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    errorDiv.textContent = data.error;
                    return;
                }

                document.getElementById("sentiment").textContent =
                    data.sentiment;

                document.getElementById("confidence").textContent =
                    (data.confidence * 100).toFixed(2) + "%";

                resultDiv.style.display = "block";

            } catch (error) {

                errorDiv.textContent =
                    "Unable to connect to the sentiment analysis API.";
            }
        }
    </script>

</body>
</html>
